<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSubdiv Static Test</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div id="info">Loading...</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const info = document.getElementById('info');

    async function init() {
      info.textContent = 'Loading OpenSubdiv WASM...';

      const { default: OpenSubdiv } = await import('../../dist/opensubdiv.mjs');
      const module = await OpenSubdiv();

      // Standard cube vertices
      const positions = new Float32Array([
        -1, -1,  1,  // 0: front-bottom-left
         1, -1,  1,  // 1: front-bottom-right
         1,  1,  1,  // 2: front-top-right
        -1,  1,  1,  // 3: front-top-left
        -1, -1, -1,  // 4: back-bottom-left
         1, -1, -1,  // 5: back-bottom-right
         1,  1, -1,  // 6: back-top-right
        -1,  1, -1   // 7: back-top-left
      ]);

      // 6 quad faces, CCW winding from outside
      const indices = new Int32Array([
        0, 1, 2, 3,  // front
        5, 4, 7, 6,  // back
        4, 0, 3, 7,  // left
        1, 5, 6, 2,  // right
        3, 2, 6, 7,  // top
        4, 5, 1, 0   // bottom
      ]);

      const subdivLevel = 2;
      const mesh = new module.SubdivisionMesh();
      const success = mesh.initFromQuads(positions, indices, 6, subdivLevel, module.BOUNDARY_EDGE_ONLY);
      
      if (!success) {
        info.textContent = 'ERROR: initFromQuads failed!';
        return;
      }

      const outPositions = mesh.getPositions();
      const outNormals = mesh.getNormals();
      const outIndices = mesh.getIndices();

      // Verify data
      let posOK = true, normOK = true, idxOK = true;
      for (let i = 0; i < outPositions.length; i++) {
        if (!isFinite(outPositions[i])) posOK = false;
      }
      for (let i = 0; i < outNormals.length; i++) {
        if (!isFinite(outNormals[i])) normOK = false;
      }
      for (let i = 0; i < outIndices.length; i++) {
        if (outIndices[i] >= mesh.getVertexCount()) idxOK = false;
      }

      info.innerHTML = `
        <b>Level ${subdivLevel} Subdivision</b><br>
        Vertices: ${mesh.getVertexCount()}<br>
        Triangles: ${mesh.getTriangleCount()}<br>
        Positions valid: ${posOK}<br>
        Normals valid: ${normOK}<br>
        Indices valid: ${idxOK}<br>
        <br>Use mouse to rotate
      `;

      // Copy to new arrays (important!)
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(outPositions), 3));
      geometry.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(outNormals), 3));
      geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(outIndices), 1));

      // Clean up WASM mesh now that we've copied the data
      mesh.delete();

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a2e);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(3, 3, 4);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Smooth shaded
      const material = new THREE.MeshStandardMaterial({
        color: 0x4a90d9,
        metalness: 0.3,
        roughness: 0.4,
        side: THREE.DoubleSide
      });
      const subdividedMesh = new THREE.Mesh(geometry, material);
      scene.add(subdividedMesh);

      // Wireframe overlay
      const wireMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        wireframe: true,
        transparent: true,
        opacity: 0.15
      });
      scene.add(new THREE.Mesh(geometry, wireMat));

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    init().catch(err => {
      console.error(err);
      info.textContent = 'Error: ' + err.message;
    });
  </script>
</body>
</html>
